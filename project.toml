[agent]
name = "gcp-bdr-optimizer"
description = "GCP Backup and Disaster Recovery (BDR) Optimization Agent. Helps optimize workload scoping, sizing, costs, and policy enforcement."
version = "0.1.0"

[execution]
modes = [
  "SIMULATION_PRE_MIGRATION",
  "LIVE_GOVERNANCE"
]

[execution.modes_detail]
SIMULATION_PRE_MIGRATION = """
Triggered when the user uploads on-premises inventory asset files (e.g., RVTools XLSX/CSVs or Migration Center CSVs).
- Operation: Parse on-premises inventory, apply protection tier rules, and compute pre-migration BDR cost projections.
- Dependency: Does not require active GCP service credentials or corresponding live Compute Engine VMs. Runs as a high-fidelity simulation model.
"""

LIVE_GOVERNANCE = """
Triggered when the user requests an audit of live GCP infrastructure or policies.
- Operation: Connects via GCE and Backup-DR APIs/MCPs to query live running virtual machines and active BackupPlanAssociations (BPA).
- Dependency: Checks and flags unprotected live cloud resources and compliance violations. Requires GCP permissions.
"""

[execution.reconciliation]
dual_reporting = true
rule = """
When both on-premises asset inventory files are uploaded AND live GCP API access is enabled, the agent must generate a 2-part dual-mode summary report:
- Section A: On-Premise Asset Pipeline (Pre-Migration Sizing Benchmark)
- Section B: Active GCP Workload Protection Audit (Real-Time Cloud State)

Do NOT raise an error or halt execution if on-premises VM names do not map directly to live GCP instance names. Treat them as complementary, overlapping datasets representing the transition pipeline.
"""

[skills]
# Import Standard Ecosystem Skills (from google/skills)
imports = [
  "google/skills/gcp-gcloud",       # For executing robust gcloud CLI commands
  "google/skills/gcp-compute",      # For Compute Engine instance and disk discovery scans
  "google/skills/gcp-bigquery",     # For executing Cloud Billing export datasets queries
  "google/skills/gcp-logging",      # For operational and BDR audit log searching
  "google/skills/code-interpreter"  # For dynamic Pandas parsing of uploaded RVTools and MC files
]

# Custom Local Skills
local = [
  "skills/vm-bdr-onboarding",       # Custom BDR VM discovery, parsing, and classification
  "skills/vault-orchestration",     # Custom BDR REST API orchestration logic
  "skills/bdr-cost-estimator"       # Custom BDR storage retention cost calculations
]

[delegation_flow]
file_ingestion = { delegate_to = "google/skills/code-interpreter", task = "Parse uploaded spreadsheets (RVTools, MC CSVs) with Pandas and output normalized JSON." }
cloud_discovery = { delegate_to = "google/skills/gcp-compute", task = "Scan and list live GCE virtual machine specs, zones, and disks." }
bdr_vault_actions = { delegate_to = "skills/vault-orchestration", task = "Formulate and dispatch REST API payloads to configure Vaults or establish BackupPlanAssociations (BPA)." }
cost_sizing = { delegate_to = "skills/bdr-cost-estimator", task = "Compute BDR cost estimations, regional rates delta-analysis, and retention lifespans." }

[[subagents]]
name = "bdr-planner"
description = "Specialized sub-agent for scoping, sizing, and estimating costs of workloads for GCP Backup and Disaster Recovery."
tasks = [
  "workload-sizing",
  "cost-estimation",
  "storage-tiering-recommendations"
]

[[subagents]]
name = "bdr-orchestrator"
description = "Specialized sub-agent for enforcing backup policies, checking compliance, and managing scheduling."
tasks = [
  "policy-enforcement",
  "compliance-auditing",
  "schedule-optimization"
]
